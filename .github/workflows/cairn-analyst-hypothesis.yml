name: CAIRN approved analyst hypothesis intake
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  pull-requests: write
  issues: read
jobs:
  propose:
    if: >-
      github.event.label.name == 'cairn-hypothesis-approved' &&
      github.event.sender.id == 320673296 &&
      github.event.issue.user.id == 320673296
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate owner-approved issue
        run: python scripts/approve_analyst_hypothesis.py
      - uses: actions/checkout@v4
        with:
          ref: aiba-feed-data
          path: ops-state
          persist-credentials: false
      - name: Install local semantic retrieval dependencies
        run: python -m pip install -r requirements.txt
      - name: Initialize historical evidence references without paid inference
        run: python -m scripts.initialize_analyst_hypotheses
        # Paid-service credentials must never enter the historical initializer.
        env:
          OPENAI_API_KEY: ''
          CAIRN_SEMANTIC_MODEL: ''
      - name: Optionally interpret initial analyst hypothesis with local Phi
        continue-on-error: true
        timeout-minutes: 22
        shell: bash
        run: bash scripts/run_cairn_phi.sh --analyst-config data/hypothesis_reviews.json
      - name: Validate reviewed configuration
        run: |
          python - <<'PY'
          import json
          from dashboard.hypothesis_evidence import reviewed_annotations
          reviewed_annotations(json.load(open('data/hypothesis_reviews.json')))
          PY
      - name: Open reviewable PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- data/hypothesis_reviews.json; then exit 0; fi
          branch="cairn-analyst-hypothesis-${{ github.event.issue.number }}-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/hypothesis_reviews.json
          git commit -m "propose CAIRN analyst hypothesis from issue #${{ github.event.issue.number }}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "CAIRN: persistent analyst hypothesis from issue #${{ github.event.issue.number }}" \
            --body "Owner-approved public issue #${{ github.event.issue.number }}. One-time bounded historical evidence initialization recorded in registry. Missing model access is explicitly flagged; no evidence signed or approved automatically."
