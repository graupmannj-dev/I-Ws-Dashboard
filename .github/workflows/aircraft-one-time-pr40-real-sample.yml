name: ONE-TIME PR40 historical real trace quality sample (no publish)

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read

jobs:
  one-off-real-source-quality:
    if: github.event.pull_request.number == 40 && github.event.pull_request.head.repo.full_name == 'graupmannj-dev/I-Ws-Dashboard' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: One historical source-day audited hash sample; ephemeral archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aiba-real-quality"
          python scripts/aircraft_real_source_pilot.py \
            --pin data/validation/aircraft_sample_day_2026_11_07_pin.json \
            --execute --acknowledge YES_SAMPLE_2026_11_07 \
            --work-dir "$RUNNER_TEMP" \
            --output "$RUNNER_TEMP/aiba-real-quality/receipt.json"
      - name: Retain aggregate summary only; no ICAO, callsigns, tracks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-source-quality-${{ github.run_id }}
          path: ${{ runner.temp }}/aiba-real-quality/receipt.json
          if-no-files-found: warn
          retention-days: 7
