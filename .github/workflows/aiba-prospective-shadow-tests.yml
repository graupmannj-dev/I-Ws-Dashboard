name: AIBA prospective shadow monitor frame tests (PR only)
on:
  pull_request:
    paths:
      - 'scripts/aiba_tipper_ledger.py'
      - 'scripts/aiba_tipper_score.py'
      - 'scripts/aiba_prospective_shadow.py'
      - 'tests/test_aiba_prospective_shadow.py'
      - 'docs/AIBA_PROSPECTIVE_SHADOW_PILOT.md'
      - '.github/workflows/aiba-prospective-shadow-tests.yml'
permissions:
  contents: read
jobs:
  shadow-frame-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate prospective frames and existing private ledger
        run: |
          python -m compileall -q scripts/aiba_tipper_ledger.py scripts/aiba_tipper_score.py scripts/aiba_prospective_shadow.py
          python -m unittest tests.test_aiba_tipper_ledger tests.test_aiba_prospective_shadow -v
