name: Validate and publish AIBA
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '35 14 * * *'
permissions:
  contents: read
concurrency:
  group: aiba-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python aiba_v5.py --output-dir _site
      - run: python ops_render.py --state /tmp/aiba-missing-feeds --site _site
      - run: python scripts/check_dashboard.py _site/index.html
      - run: node --check /tmp/aiba-dashboard.js
  collect:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: aiba-feed-data
          path: ops-state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: cache
          key: gdelt-${{ runner.os }}-${{ github.run_id }}
          restore-keys: gdelt-${{ runner.os }}-
      - name: Collect and require all 35 valid daily archives
        run: python aiba_v5.py --download-days 35 --wiki-days 90 --strict-gdelt --output-dir _site
      - run: python ops_render.py --state ops-state/observations --site _site
      - run: python scripts/check_dashboard.py _site/index.html
      - run: node --check /tmp/aiba-dashboard.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: collect
    if: github.ref == 'refs/heads/main' && vars.AIBA_PUBLISH_APPROVED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
