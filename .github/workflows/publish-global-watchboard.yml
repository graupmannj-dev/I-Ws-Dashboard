name: Validate and publish AIBA
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '35 14 * * *'
permissions:
  contents: read
concurrency:
  group: aiba-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python aiba_v5.py --output-dir _site
      - run: python ops_render.py --state /tmp/aiba-missing-feeds --site _site
      - run: python fusion_briefs.py --state /tmp/aiba-missing-feeds
      - run: python decision_render.py --state /tmp/aiba-missing-feeds --site _site
      - run: python scripts/check_dashboard.py _site/index.html
      - run: node --check /tmp/aiba-dashboard.js
      - run: python dashboard/build_atlas.py --site _site
      - run: python scripts/check_atlas.py _site
      - run: node --check _site/dashboard/atlas.js
      - run: node --check _site/dashboard/layers.js
  collect:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: aiba-feed-data
          path: ops-state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: cache
          key: gdelt-${{ runner.os }}-${{ github.run_id }}
          restore-keys: gdelt-${{ runner.os }}-
      - name: Collect and require all 35 valid daily archives
        run: python aiba_v5.py --download-days 35 --wiki-days 90 --strict-gdelt --output-dir _site
      - run: python ops_render.py --state ops-state/observations --site _site
      - run: python decision_render.py --state ops-state/observations --site _site
      - run: python scripts/check_dashboard.py _site/index.html
      - run: node --check /tmp/aiba-dashboard.js
      - name: Collect optional public map overlays
        run: python dashboard/collect_layers.py --output _site/layers.json
      - run: python dashboard/build_atlas.py --site _site
        env:
          AIBA_LAYER_FEED_URL: ${{ vars.AIBA_LAYER_FEED_URL || 'layers.json' }}
      - run: python scripts/check_atlas.py _site
      - run: node --check _site/dashboard/atlas.js
      - run: node --check _site/dashboard/layers.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: collect
    if: github.ref == 'refs/heads/main' && vars.AIBA_PUBLISH_APPROVED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  operational-smoke:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe public source feeds without writing or publishing
        shell: bash
        run: |
          python ops_pipeline.py --mode markets --state /tmp/aiba-live-probe
          python watchlist_collector.py --state /tmp/aiba-live-probe
          python ops_pipeline.py --mode official --state /tmp/aiba-live-probe
          python ops_pipeline.py --mode commercial --state /tmp/aiba-live-probe
          python scripts/smoke_ops.py /tmp/aiba-live-probe

  atlas-browser:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Build offline Pages preview
        run: |
          python aiba_v5.py --output-dir _site
          python ops_render.py --state /tmp/aiba-globe-no-ops --site _site
          python fusion_briefs.py --state /tmp/aiba-globe-no-ops
          python decision_render.py --state /tmp/aiba-globe-no-ops --site _site
          python dashboard/build_atlas.py --site _site
      - name: Install local browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
      - name: Serve built page and test actual interactions
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory _site > /tmp/aiba-atlas-server.log 2>&1 &
          sleep 2
          node scripts/test_atlas_browser.js
      - name: Attach dashboard browser preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-preview
          path: atlas-preview.jpg
          if-no-files-found: ignore
