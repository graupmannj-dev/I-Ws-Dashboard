name: Validate and publish AIBA
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Collect AIBA operational feeds', 'Ingest AIBA analyst OSINT report']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '35 14 * * *'
permissions:
  contents: read
concurrency:
  group: aiba-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python aiba_v5.py --output-dir _site
      - run: python ops_render.py --state /tmp/aiba-missing-feeds --site _site
      - run: python fusion_briefs.py --state /tmp/aiba-missing-feeds
      - run: python decision_render.py --state /tmp/aiba-missing-feeds --site _site
      - run: python scripts/check_dashboard.py _site/index.html
      - run: node --check /tmp/aiba-dashboard.js
      - run: python friction_render.py --state /tmp/aiba-missing-feeds --site _site
      - run: python dashboard/build_atlas.py --site _site
      - run: python scripts/check_atlas.py _site
      - run: node --check _site/dashboard/atlas.js
      - run: node --check _site/dashboard/layers.js
  collect:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: aiba-feed-data
          path: ops-state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: cache
          key: gdelt-${{ runner.os }}-${{ github.run_id }}
          restore-keys: gdelt-${{ runner.os }}-
      - name: Collect and require all 35 valid daily archives
        run: python aiba_v5.py --download-days 35 --wiki-days 90 --strict-gdelt --output-dir _site
      - run: python ops_render.py --state ops-state/observations --site _site
      - run: python decision_render.py --state ops-state/observations --site _site
      - run: python scripts/check_dashboard.py _site/index.html
      - run: node --check /tmp/aiba-dashboard.js
      - name: Collect optional public map overlays
        run: python dashboard/collect_layers.py --output _site/layers.json
      - run: python friction_render.py --state ops-state/observations --site _site
      - run: python dashboard/build_atlas.py --site _site --state ops-state/observations
        env:
          AIBA_LAYER_FEED_URL: ${{ vars.AIBA_LAYER_FEED_URL || 'layers.json' }}
      - run: python scripts/check_atlas.py _site
      - run: node --check _site/dashboard/atlas.js
      - run: node --check _site/dashboard/layers.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: collect
    if: github.ref == 'refs/heads/main' && vars.AIBA_PUBLISH_APPROVED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  operational-smoke:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe public source feeds without writing or publishing
        shell: bash
        run: |
          python ops_pipeline.py --mode markets --state /tmp/aiba-live-probe
          python watchlist_collector.py --state /tmp/aiba-live-probe
          python ops_pipeline.py --mode official --state /tmp/aiba-live-probe
          python ops_pipeline.py --mode commercial --state /tmp/aiba-live-probe
          python scripts/smoke_ops.py /tmp/aiba-live-probe

  atlas-browser:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Build offline Pages preview
        run: |
          python aiba_v5.py --output-dir _site
          python ops_render.py --state /tmp/aiba-globe-no-ops --site _site
          python fusion_briefs.py --state /tmp/aiba-globe-no-ops
          python decision_render.py --state /tmp/aiba-globe-no-ops --site _site
          python friction_render.py --state /tmp/aiba-globe-no-ops --site _site
          python dashboard/build_atlas.py --site _site
      - name: Install local browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
      - name: Serve built page and test actual interactions
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory _site > /tmp/aiba-atlas-server.log 2>&1 &
          sleep 2
          node scripts/test_atlas_browser.js
      - name: Attach dashboard browser preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-preview
          path: atlas-preview.jpg
          if-no-files-found: ignore

  friction-live-probe:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # API accessibility is external and not needed for offline correctness.
    # The live status MUST still be reviewed manually before enabling alerts.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect IODA envelope structure (keys only; no raw event logging)
        continue-on-error: true
        run: |
          python - <<'PY'
          import datetime as dt
          from urllib.parse import urlencode
          from friction_pipeline import IODA, fetch
          now=int(dt.datetime.now(dt.timezone.utc).timestamp())
          data=fetch(IODA+"?"+urlencode({
              "from":now-14400,"until":now,"entityType":"country",
              "limit":10,"page":0,"extendWindowSeconds":0}))
          nested=data.get("data") if isinstance(data,dict) else None
          print("IODA envelope:",{
              "kind":type(data).__name__,
              "keys": sorted(data.keys())[:16] if isinstance(data,dict) else [],
              "type":str(data.get("type"))[:80] if isinstance(data,dict) else "",
              "error":str(data.get("error"))[:250] if isinstance(data,dict) else "",
              "data_kind":type(nested).__name__,
              "data_keys":sorted(nested.keys())[:16] if isinstance(nested,dict) else [],
              "data_items":len(nested) if isinstance(nested,list) else None,
              "first_item_keys":sorted(nested[0].keys())[:15] if isinstance(nested,list) and nested and isinstance(nested[0],dict) else [],
          })
          PY
      - name: Probe bounded NGA and IODA endpoints without publishing
        shell: bash
        run: |
          set +e
          python friction_pipeline.py --state /tmp/aiba-friction-pr
          status=$?
          set -e
          python friction_synthesis.py --state /tmp/aiba-friction-pr
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("/tmp/aiba-friction-pr/health")
          lines=["## AIBA friction source probe (NO production ingestion)","","| Feed | Status | Records | Error |","|---|---|---:|---|"]
          for name in ("ioda","nga","amsa"):
              health=json.loads((root/f"friction_{name}.json").read_text())
              lines.append(f"| {name} | {health['status']} | {health['records']} | {str(health.get('error') or '')[:100]} |")
          summary="\n".join(lines)+"\n"
          print(summary)
          import os
          if os.getenv("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f: f.write(summary)
          PY
          if [ "$status" -ne 0 ]; then
            echo "::warning::No friction feeds responded with valid usable JSON in PR probe"
          fi

  live-restrictions-probe:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check official geometry feed compatibility without production writes
        shell: bash
        run: |
          set +e
          python dashboard/live_layer_snapshots.py --state /tmp/aiba-live-restrictions-pr
          rc=$?
          set -e
          python - <<'PY'
          import json,os
          from pathlib import Path
          health=Path("/tmp/aiba-live-restrictions-pr/health/live_layers.json")
          if not health.exists():
              raise SystemExit("No live source health generated")
          rows=json.loads(health.read_text())
          lines=["## Official near-live restriction probe (PR only)","",
                 "| Source | Status | Valid notices | Shapes | Points | Skipped |",
                 "|---|---|---:|---:|---:|---:|"]
          for key in ("airspace","maritime"):
              r=rows[key]
              lines.append(f"| {key} | {r['status']} | {r['record_count']} | {r.get('shape_records')} | {r.get('point_records')} | {r['skipped']} |")
          summary="\n".join(lines)+"\n"
          print(summary)
          if os.getenv("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:f.write(summary)
          PY
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Neither official restriction source could be parsed; do not claim near-live coverage."
          fi
