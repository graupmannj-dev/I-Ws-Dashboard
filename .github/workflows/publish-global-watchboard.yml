name: Validate and publish AIBA
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Collect AIBA operational feeds', 'Ingest AIBA analyst OSINT report', 'Collect CAIRN public alternative sensors']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '35 14 * * *'
permissions:
  contents: read
concurrency:
  group: aiba-${{ github.ref }}
  cancel-in-progress: false
jobs:
  swpc-ripe-public-live-probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only NOAA SWPC / RIPE public aggregate probe
        run: |
          python alternative_sensor_pipeline.py --state /tmp/cairn-swpc-ripe --sources swpc,ripe
          python - <<'PY'
          import json
          from pathlib import Path
          for mode in ('swpc','ripe'):
              file=Path('/tmp/cairn-swpc-ripe/health')/(mode+'.json')
              state=json.loads(file.read_text())
              print(mode, 'health:', state['status'],
                    'records:',state['records'],
                    'queried:',state['source_queries_ok'],'/',state['source_queries_attempted'],
                    'errors:',state.get('source_errors',[])[:2])
          PY
  cairn-public-sensor-probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect bounded first-party public source envelopes without publishing
        run: |
          python alternative_sensor_pipeline.py --state /tmp/cairn-public-sensor-probe
      - name: Assert provider-level health receipts and no invented all-clear
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from alternative_sensor_pipeline import MODES,SCHEMA
          path=Path("/tmp/cairn-public-sensor-probe/health")
          for name in MODES:
              d=json.loads((path/(name+".json")).read_text())
              assert d["schema"]==SCHEMA
              assert d["status"] in ("collected","partial","unavailable")
              assert d["operational_warning_approved"] is False
              assert d["source_queries_attempted"]>=1
              if d["status"]=="unavailable":
                  assert d["records"] is None
                  assert d["missingness"]=="not_measured_not_zero"
              print(name, d["status"], "valid records:",
                    d["records"],"queries:",
                    d["source_queries_ok"],"/",d["source_queries_attempted"])
          PY
  topic-quality-audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local analytic dependencies
        run: python -m pip install -r requirements.txt
      - name: Measure dated source-title topic pair error, lexical vs hybrid
        run: python scripts/eval_family_topics.py --out topic-quality-audit.json
      - name: Preserve machine-readable quality audit and error cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cairn-topic-quality-audit
          path: topic-quality-audit.json
          if-no-files-found: ignore
  automatic-topics-real-input:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: aiba-feed-data
          path: ops-state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned local embedding dependencies
        run: python -m pip install -r requirements.txt
      - name: Inspect automatic family assignments from real registry without writing
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          from dashboard.dynamic_bins import build
          from dashboard.automatic_topics import assign, documents
          reg=json.loads(Path('ops-state/observations/latest/behavioral_registry.json').read_text())
          now=dt.datetime.fromisoformat(reg['generated_at'].replace('Z','+00:00'))
          result=build(reg,{'records':[]},now=now+dt.timedelta(minutes=10))
          auto=[x for x in result['families'] if x['kind']=='analytical_topic_family'
               and x.get('activity')=='automatically_discovered_shared_subject']
          print('Automatic topical families found:',len(auto))
          for family in auto[:30]:
              print(family['title'][:100], 'docs:',family['notice_count'],
                    'sources:',family['source_record_count'],
                    'providers:',family['providers'])
              assert family['notice_count']>=2
              assert family['warning_approved'] is False
              assert family['source_independence_established'] is False
              assert family['map_eligible'] is False
              assert family['anomaly_metric'].get('status') in ('not_calibrated','calibrated_metric')
              assert all(n['source_url'].startswith('https://') for n in family['notice_groups'])
          # Repeated template-only travel and FAA feeds must not become
          # independent, unverified bulk topics.
          assert not any(f['source_families']==['protective_notice'] for f in auto)
          # Repeat notices at one documented airspace subject (e.g., Boise)
          # CAN be an analytical topic. Blanket source-wide clustering cannot.
          total_airspace=sum(x.get('source_family')=='airspace_restriction'
                             for x in reg['records'])
          for f in auto:
              if f['source_families']==['airspace_restriction']:
                  assert f['source_record_count'] < max(5,int(total_airspace*0.65)), (
                      'Source template appears to have swallowed a majority of FAA records',
                      f['title'], f['source_record_count'], total_airspace)
          print('Original source documents:',len(documents(reg['records'])))
          PY
  analytical-topic-real-input:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: aiba-feed-data
          path: ops-state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned local embedding dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Denmark official topic grouping on real saved notices
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          from dashboard.dynamic_bins import build
          from dashboard.topic_families import topic_key
          path=Path("ops-state/observations/latest/behavioral_registry.json")
          raw=json.loads(path.read_text())
          when=dt.datetime.fromisoformat(raw["generated_at"].replace("Z","+00:00"))
          # The classifier accepts both "firing exercise" and "firing
          # exercises" as the same source-declared maritime activity.
          # Keep the regression's reference set aligned with the actual
          # source classification, not one literal English inflection.
          observed=[x for x in raw["records"]
              if topic_key(x)==("Denmark","maritime-firing-exercises")]
          result=build(raw,{"records":[]},now=when+dt.timedelta(minutes=10))
          groups=[f for f in result["families"] if
                  f.get("kind")=="analytical_topic_family" and f.get("country")=="Denmark"]
          if len(observed)>=2:
              assert len(groups)==1, (len(observed), len(groups))
              f=groups[0]
              assert f["notice_count"]==len({x["source_url"] for x in observed})
              assert f["source_record_count"]==len(observed)
              assert sum(n["source_record_count"] for n in f["notice_groups"])==len(observed)
              assert f["source_independence_established"] is False
              assert f["warning_approved"] is False
              assert f["anomaly_metric"]["z_score"] is None
              print("Live registry: grouped",len(observed),"fragments into",
                    f["notice_count"],"distinct notices in one Denmark analyst family")
          else:
              print("No eligible current Denmark notices; synthetic tests remain required.")
          PY
  family-archive-real-input:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: aiba-feed-data
          path: ops-state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned local embedding dependencies
        run: python -m pip install -r requirements.txt
      - name: Dry-run archive migration on actual public evidence snapshots
        run: |
          python - <<'PY'
          from pathlib import Path
          from family_archive import update
          snapshot=update(Path("ops-state/observations"),write=False)
          assert snapshot["alerts_promoted"] == 0
          assert snapshot["root_count_total"] >= 0
          print({k:snapshot[k] for k in
              ("root_count_total","record_count_total","new_records_added",
               "historical_relationship_count","public_snapshot_truncated")})
          PY
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python aiba_v5.py --output-dir _site
      - run: python ops_render.py --state /tmp/aiba-missing-feeds --site _site
      - run: python fusion_briefs.py --state /tmp/aiba-missing-feeds
      - run: python decision_render.py --state /tmp/aiba-missing-feeds --site _site
      - run: python scripts/check_dashboard.py _site/index.html
      - run: node --check /tmp/aiba-dashboard.js
      - run: python friction_render.py --state /tmp/aiba-missing-feeds --site _site
      - run: python behavioral_render.py --state /tmp/aiba-missing-feeds --site _site
      - run: python dashboard/build_atlas.py --site _site
      - run: python scripts/check_atlas.py _site
      - run: node --check _site/dashboard/atlas.js
      - run: node --check _site/dashboard/hypotheses.js
      - run: node --check _site/dashboard/coverage.js
      - run: node --check _site/dashboard/layers.js
  collect:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: aiba-feed-data
          path: ops-state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: cache
          key: gdelt-${{ runner.os }}-${{ github.run_id }}
          restore-keys: gdelt-${{ runner.os }}-
      - name: Collect with strict GDELT gate; degrade only on missing archives
        shell: bash
        run: |
          set +e
          python aiba_v5.py --download-days 35 --wiki-days 90 --strict-gdelt --output-dir _site > /tmp/aiba-strict.log 2>&1
          rc=$?
          set -e
          cat /tmp/aiba-strict.log
          if [ "$rc" -ne 0 ]; then
            if ! grep -q 'REFUSING TO PUBLISH: require all 7 recent and 28 baseline valid daily archives' /tmp/aiba-strict.log; then
              echo "::error::Unexpected build failure; do not mask it with a partial publication"
              exit "$rc"
            fi
            echo "::warning::GDELT daily archive window incomplete. Publishing other validated feeds; suppressing GDELT discovery."
            python aiba_v5.py --wiki-days 90 --allow-partial-gdelt --output-dir _site
            python - <<'PY'
          import json
          from pathlib import Path
          status=json.loads(Path("_site/collection_status.json").read_text())
          if status["discovery_status"] != "missing_data":
              raise SystemExit("Degraded build did not report missing GDELT data")
          print("Partial publication: GDELT discovery suppressed; other feeds may continue.")
          PY
          fi
      - run: python ops_render.py --state ops-state/observations --site _site
      - run: python decision_render.py --state ops-state/observations --site _site
      - run: python scripts/check_dashboard.py _site/index.html
      - run: node --check /tmp/aiba-dashboard.js
      - name: Collect optional public map overlays
        run: python dashboard/collect_layers.py --output _site/layers.json
      - run: python friction_render.py --state ops-state/observations --site _site
      - run: python behavioral_render.py --state ops-state/observations --site _site
      - name: Bounded original-source and geographic-text inspection
        continue-on-error: true
        timeout-minutes: 4
        shell: bash
        run: |
          python scripts/cairn_source_inspection.py \
            --registry ops-state/observations/latest/behavioral_registry.json \
            --archive ops-state/observations/latest/family_archive.json \
            --config data/hypothesis_discriminators.json \
            --maximum 12 --output _site/source_inspection.json
      - run: python dashboard/build_atlas.py --site _site --state ops-state/observations
        env:
          AIBA_LAYER_FEED_URL: ${{ vars.AIBA_LAYER_FEED_URL || 'layers.json' }}
      - name: Publish no-paid-API semantic fallback receipt
        run: python dashboard/semantic_ach.py --site _site --max-cases 40
        # Never permit an accidentally configured hosted API to run in CAIRN publishing.
        env:
          OPENAI_API_KEY: ''
          CAIRN_SEMANTIC_MODEL: ''
      - name: Preserve semantic interpretation audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cairn-semantic-ach-${{ github.run_id }}
          path: _site/semantic_ach.json
          retention-days: 90
          if-no-files-found: ignore
      - run: python scripts/check_atlas.py _site
      - run: node --check _site/dashboard/atlas.js
      - run: node --check _site/dashboard/hypotheses.js
      - run: node --check _site/dashboard/coverage.js
      - run: node --check _site/dashboard/layers.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: collect
    if: github.ref == 'refs/heads/main' && vars.AIBA_PUBLISH_APPROVED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  automatic-hypothesis-real-source-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: aiba-feed-data
          path: ops-state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only automatic hypothesis screening against actual evidence snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from dashboard.hypothesis_auto_review import screen, SCHEMA
          def read(path):
              try:
                  return json.loads(Path(path).read_text())
              except (OSError, ValueError):
                  return {}
          cases=read("data/verified_hotspots.json")
          registry=read("ops-state/observations/latest/behavioral_registry.json")
          archive=read("ops-state/observations/latest/family_archive.json")
          output=screen(cases,registry,archive)
          assert output["schema"]==SCHEMA
          assert output["operational_warnings_issued"]==0
          assert output["analyst_direction_overridden"] is False
          print("Review status:",output["status"],"snapshot:",output["source_snapshot_at"],
                "new records:",output["new_source_records_in_window"],
                "durable archive:",output["durable_archive_used"])
          for case_id,c in output["cases"].items():
              print(case_id,":",c["new_matching_records"],"eligible;",
                    c["possible_support"],"possible supporting;",
                    c["possible_counter"],"possible counter; ",
                    c["unavailable_source_matches"],"unavailable")
              assert all(not a["analyst_approved"] and not a["warning_approved"]
                         for a in c["candidates"])
          PY
  competing-hypotheses-real-source-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: aiba-feed-data
          path: ops-state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only competing-hypothesis scan against source evidence archive
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from dashboard.hypothesis_discriminator_engine import assess, SCHEMA
          def read(path):
              try:
                  return json.loads(Path(path).read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  return {}
          dossier=read("data/verified_hotspots.json")
          registry=read("ops-state/observations/latest/behavioral_registry.json")
          archive=read("ops-state/observations/latest/family_archive.json")
          baseline=read("ops-state/observations/latest/behavioral_baselines.json")
          cfg=read("data/hypothesis_discriminators.json")
          result=assess(dossier,registry,archive,{},baseline,cfg)
          assert result["schema"]==SCHEMA
          assert result["hypothesis_count"]==len(dossier)==10
          assert result["automated_warnings"]==0
          assert result["analyst_approved_directions"]==0
          assert result["probability_of_conflict"] is None
          print("CAIRN discriminator scan",result["status"],
                "source documents:",result["source_records_in_window"],
                "truncated:",result["candidate_input_truncated"])
          for cid,c in result["cases"].items():
              s=c["summary"]
              print(cid,":",s["competing_pattern"],
                    "escalation:",s["escalation_signpost_nominations"],
                    "alternatives:",s["alternative_signpost_nominations"],
                    "ambiguous:",s["ambiguous_signpost_nominations"],
                    "case docs:",s["source_documents_case_associated"])
              assert s["direction_of_armed_conflict_hypothesis"]=="not_estimated"
              assert not s["source_independence_established"]
              assert not s["warning_promoted"]
              for row in c["discriminators"]:
                  for source in row["sources"]:
                      assert source["source_url"].startswith("https://")
                      assert source["analyst_approved"] is False
                      assert source["independent_observation_confirmed"] is False
              assert all(not item["case_specific"] for item in c["source_baseline_readiness"])
          PY
  historical-source-replay-real-input:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: aiba-feed-data
          path: ops-state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Historical as-of replay using real collection snapshots
        run: |
          python scripts/cairn_historical_replay.py \
            --history ops-state/observations/history/behavioral_registry \
            --archive ops-state/observations/latest/family_archive.json \
            --out historical-source-evaluation.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("historical-source-evaluation.json").read_text())
          assert r["status"]=="historical_source_visibility_diagnostic_only"
          assert r["lookahead_restricted_to_snapshot_asof"]
          assert r["source_snapshots_used"]>0
          assert r["real_outcome_gold_standard"] is False
          assert r["real_event_precision"] is None
          assert r["real_event_recall"] is None
          assert r["warning_lead_time_hours"] is None
          assert len(r["cases"])==10
          print("Historical source replay days:",r["source_snapshots_used"],
                "curated comparison-covered observations:",
                r["reference_signals_within_available_history"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cairn-history-source-asof-${{ github.run_id }}
          path: historical-source-evaluation.json
          retention-days: 30
  historical-original-source-probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve real GOV.UK historical original document narratives (no outcomes)
        run: |
          python scripts/cairn_historical_original_source_eval.py \
            --seeds data/govuk_source_seed_manifest.json \
            --limit 9 --out historical-original-source-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("historical-original-source-audit.json").read_text())
          assert x["schema"]=="cairn.historical-original-documents.v1"
          assert x["real_original_documents_requested"]==9
          assert x["event_occurrence_ground_truth"] is None
          assert x["warning_detection_recall"] is None
          assert all(not r["reported_site_verified"] for r in x["reports"])
          print("Real historical source-text availability:",x["real_original_documents_inspected"],
                "/",x["real_original_documents_requested"],
                "; named localities:",x["real_original_documents_with_named_action_locality"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cairn-historical-original-source-${{ github.run_id }}
          path: historical-original-source-audit.json
          retention-days: 30
  real-source-inspection-prototype:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: aiba-feed-data
          path: ops-state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only allowlisted live document inspection
        run: |
          python scripts/cairn_source_inspection.py \
            --registry ops-state/observations/latest/behavioral_registry.json \
            --archive ops-state/observations/latest/family_archive.json \
            --maximum 10 --output source-inspection-real-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("source-inspection-real-smoke.json").read_text())
          assert report["schema"]=="cairn.source-inspection.v1"
          assert report["unique_source_documents_attempted"]<=10
          assert not report["source_bodies_saved"] and not report["source_bodies_published"]
          assert report["automated_event_verifications"]==0 and report["approved_warnings"]==0
          for row in report["inspections"]:
              assert not row["event_occurred_verified"]
              assert not row["actor_verified"]
              assert not row["independent_corroboration"]
              if row["document_inspection"]:
                  assert "source_text" not in row["document_inspection"]
                  assert not row["document_inspection"]["case_attribution"]["reported_event_site_verified"]
          print("CAIRN source inspection:",report["status_counts"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cairn-source-inspection-real-source-${{ github.run_id }}
          path: source-inspection-real-smoke.json
          retention-days: 30
  operational-smoke:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe public source feeds without writing or publishing
        shell: bash
        run: |
          python ops_pipeline.py --mode markets --state /tmp/aiba-live-probe
          python watchlist_collector.py --state /tmp/aiba-live-probe
          python ops_pipeline.py --mode official --state /tmp/aiba-live-probe
          python ops_pipeline.py --mode commercial --state /tmp/aiba-live-probe
          python scripts/smoke_ops.py /tmp/aiba-live-probe

  atlas-browser:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Build offline Pages preview
        run: |
          python aiba_v5.py --output-dir _site
          python ops_render.py --state /tmp/aiba-globe-no-ops --site _site
          python fusion_briefs.py --state /tmp/aiba-globe-no-ops
          python decision_render.py --state /tmp/aiba-globe-no-ops --site _site
          python friction_render.py --state /tmp/aiba-globe-no-ops --site _site
          python behavioral_render.py --state /tmp/aiba-globe-no-ops --site _site
          python dashboard/build_atlas.py --site _site
      - name: Install local browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
      - name: Serve built page and test actual interactions
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory _site > /tmp/aiba-atlas-server.log 2>&1 &
          sleep 2
          node scripts/test_atlas_browser.js
          node scripts/test_dynamic_bins_browser.js
          node scripts/test_topic_families_browser.js
          node scripts/test_automatic_topics_browser.js
          node scripts/test_source_status_browser.js
          node scripts/test_hypothesis_browser.js
          node scripts/test_phi_sidecar_browser.js
          node scripts/test_hypothesis_auto_browser.js
          node scripts/test_coverage_browser.js
          node scripts/test_cairn_navigation_browser.js
          node scripts/test_cairn_priority_browser.js
          node scripts/test_atlas_behavior_browser.js
          node scripts/test_atlas_evaluation_browser.js
          node scripts/test_aircraft_browser.js
      - name: Attach dashboard browser preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-preview
          path: atlas-preview.jpg
          if-no-files-found: ignore

  friction-live-probe:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # API accessibility is external and not needed for offline correctness.
    # The live status MUST still be reviewed manually before enabling alerts.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect IODA envelope structure (keys only; no raw event logging)
        continue-on-error: true
        run: |
          python - <<'PY'
          import datetime as dt
          from urllib.parse import urlencode
          from friction_pipeline import IODA, fetch
          now=int(dt.datetime.now(dt.timezone.utc).timestamp())
          data=fetch(IODA+"?"+urlencode({
              "from":now-14400,"until":now,"entityType":"country",
              "limit":10,"page":0,"extendWindowSeconds":0}))
          nested=data.get("data") if isinstance(data,dict) else None
          print("IODA envelope:",{
              "kind":type(data).__name__,
              "keys": sorted(data.keys())[:16] if isinstance(data,dict) else [],
              "type":str(data.get("type"))[:80] if isinstance(data,dict) else "",
              "error":str(data.get("error"))[:250] if isinstance(data,dict) else "",
              "data_kind":type(nested).__name__,
              "data_keys":sorted(nested.keys())[:16] if isinstance(nested,dict) else [],
              "data_items":len(nested) if isinstance(nested,list) else None,
              "first_item_keys":sorted(nested[0].keys())[:15] if isinstance(nested,list) and nested and isinstance(nested[0],dict) else [],
          })
          PY
      - name: Probe bounded NGA and IODA endpoints without publishing
        shell: bash
        run: |
          set +e
          python friction_pipeline.py --state /tmp/aiba-friction-pr
          status=$?
          set -e
          python friction_synthesis.py --state /tmp/aiba-friction-pr
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("/tmp/aiba-friction-pr/health")
          lines=["## AIBA friction source probe (NO production ingestion)","","| Feed | Status | Records | Error |","|---|---|---:|---|"]
          for name in ("ioda","nga","amsa"):
              health=json.loads((root/f"friction_{name}.json").read_text())
              lines.append(f"| {name} | {health['status']} | {health['records']} | {str(health.get('error') or '')[:100]} |")
          summary="\n".join(lines)+"\n"
          print(summary)
          import os
          if os.getenv("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f: f.write(summary)
          PY
          if [ "$status" -ne 0 ]; then
            echo "::warning::No friction feeds responded with valid usable JSON in PR probe"
          fi

  live-restrictions-probe:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check official geometry feed compatibility without production writes
        shell: bash
        run: |
          set +e
          python dashboard/live_layer_snapshots.py --state /tmp/aiba-live-restrictions-pr
          rc=$?
          set -e
          python - <<'PY'
          import json,os
          from pathlib import Path
          health=Path("/tmp/aiba-live-restrictions-pr/health/live_layers.json")
          if not health.exists():
              raise SystemExit("No live source health generated")
          rows=json.loads(health.read_text())
          lines=["## Official near-live restriction probe (PR only)","",
                 "| Source | Status | Valid notices | Shapes | Points | Skipped |",
                 "|---|---|---:|---:|---:|---:|"]
          for key in ("airspace","maritime"):
              r=rows[key]
              lines.append(f"| {key} | {r['status']} | {r['record_count']} | {r.get('shape_records')} | {r.get('point_records')} | {r['skipped']} |")
          summary="\n".join(lines)+"\n"
          print(summary)
          if os.getenv("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:f.write(summary)
          PY
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Neither official restriction source could be parsed; do not claim near-live coverage."
          fi

  postdeploy-source-and-historical-evaluation:
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: aiba-feed-data
          path: ops-state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve newly deployed, metadata-only source review receipt
        continue-on-error: true
        run: |
          curl -fLSs --retry 3 --retry-delay 2 --max-time 35 \
            https://graupmannj-dev.github.io/I-Ws-Dashboard/source_inspection.json \
            -o /tmp/cairn-deployed-source-inspection.json
      - name: Time-fenced replay AFTER GitHub Pages deployed
        run: |
          if test -s /tmp/cairn-deployed-source-inspection.json; then
            extra="--inspection /tmp/cairn-deployed-source-inspection.json"
          else
            extra=""
          fi
          python scripts/cairn_historical_replay.py \
            --history ops-state/observations/history/behavioral_registry \
            --archive ops-state/observations/latest/family_archive.json \
            --out historical-source-evaluation.json $extra
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('historical-source-evaluation.json').read_text())
          assert r["status"]=="historical_source_visibility_diagnostic_only"
          assert r["lookahead_restricted_to_snapshot_asof"] is True
          assert r["real_event_precision"] is None
          assert r["real_event_recall"] is None
          assert r["warning_lead_time_hours"] is None
          hints=r["case_hint_diagnostic"]
          controls=r["controlled_source_class_audit"]
          msg=[
            "## CAIRN AFTER-DEPLOYMENT historical source review (not prediction validation)",
            "- Time-fenced original daily source snapshots: **"+str(r["source_snapshots_used"])+"**",
            "- Actual collection history: **"+r["first_source_snapshot_day"]+" – "+r["last_source_snapshot_day"]+"**",
            "- Reference dated dossier observations inside source-history coverage: **"+
                str(r["reference_signals_within_available_history"])+"/"+
                str(r["reference_curated_dated_signals"])+"**",
            "- Case-hinted analyst report documents: **"+str(hints["report_count"])+"**, independently matched by literal title/geography without hints: **"+
                str(hints["title_and_geography_matched_without_prior_hint"])+"**",
            "- Training exercise source-control rows: **"+
                str(controls["source_rows_with_literal_training_exercise_titles"])+"**; nominated escalation signposts: **"+
                str(controls["escalation_title_nominations_in_this_subset"])+"**",
            "- Latest deployed source-inspection metadata: "+str(r["deployed_source_inspection_diagnostic"]),
            "- These are source visibility and attribution diagnostics, NOT verified real-world episode classification.",
            "- Real event precision, recall, false positive rate and warning lead time: **not estimable** without independent outcome labels.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("\n".join(msg)+"\n")
          PY
      - name: Historical original-source text audit against dated GOV.UK reports
        run: |
          python scripts/cairn_historical_original_source_eval.py \
            --seeds data/govuk_source_seed_manifest.json \
            --limit 12 \
            --out historical-original-source-audit.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads(Path("historical-original-source-audit.json").read_text())
          assert x["schema"]=="cairn.historical-original-documents.v1"
          assert x["event_occurrence_ground_truth"] is None
          assert x["incident_geo_precision_against_verified_sites"] is None
          assert all(not report["reported_site_verified"] for report in x["reports"])
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("\n### Source-text processing on actual dated historical GOV.UK documents\n")
              f.write(f"- Original government narratives retrieved: **{x['real_original_documents_inspected']}/{x['real_original_documents_requested']}**\n")
              f.write(f"- Literal named action-localities in available documents: **{x['real_original_documents_with_named_action_locality']}**\n")
              f.write("- These are source-text/geographic parsing diagnostics, NOT validated incident locations or source-at-time warning performance.\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cairn-postdeploy-historical-source-audit-${{ github.run_id }}
          path: |
            historical-source-evaluation.json
            historical-original-source-audit.json
          retention-days: 90

  phi-postdeploy:
    name: Nonblocking local Phi evidence-hash sidecar
    needs: deploy
    if: github.ref == 'refs/heads/main' && vars.AIBA_PUBLISH_APPROVED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 52
    permissions:
      contents: write
    concurrency:
      group: cairn-phi-postdeploy-sidecar
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: cairn-phi-results
          path: phi-state
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download exact Pages artifact from this successful deployment
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/cairn-published-archive
      - name: Extract bounded source snapshot (never fetch mutable live Pages)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cairn-published"
          tar -xf "$RUNNER_TEMP/cairn-published-archive/artifact.tar" \
              -C "$RUNNER_TEMP/cairn-published" ./hypotheses.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"cairn-published/hypotheses.json"
          d=json.loads(p.read_text())
          assert d["schema"]=="cairn.hypothesis-evidence.v1"
          assert d.get("phi_async_enabled") is True
          assert len(d["hypotheses"])==10
          assert all(isinstance(c.get("semantic_input_sha256"),str) for c in d["hypotheses"])
          print("Exact deployment source cases:",len(d["hypotheses"]))
          PY
      - name: Compare current evidence packets to verified cached receipts
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.cairn_phi_incremental prepare \
            --source "$RUNNER_TEMP/cairn-published/hypotheses.json" \
            --prior phi-state/phi/latest.json \
            --work "$RUNNER_TEMP/cairn-phi-work" \
            --max-cases 10 --max-age-hours 24
      - name: Restore pinned local-model binaries (never server logs)
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/cairn-local-phi/model.gguf
            ${{ runner.temp }}/cairn-local-phi/llama
          key: cairn-local-phi-ubuntu24-325914defd2-01999f17c39c
      - name: Infer only changed/expired cases after source publication
        continue-on-error: true
        timeout-minutes: 36
        shell: bash
        env:
          OPENAI_API_KEY: ''
          CAIRN_SEMANTIC_MODEL: ''
        run: |
          set -euo pipefail
          count=$(python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"cairn-phi-work/phi_manifest.json").read_text())
          print(len(d["changed"]))
          PY
          )
          if [ "$count" -eq 0 ]; then
            echo "No changed or expired packets; no model process will be started."
          else
            echo "Running bounded Phi for $count changed source packets only."
            timeout --signal=TERM --kill-after=15s 32m \
              bash scripts/run_cairn_phi.sh --site "$RUNNER_TEMP/cairn-phi-work" --max-cases 10
          fi
      - name: Assemble fail-closed, versioned public Phi sidecar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cairn-phi-result"
          python -m scripts.cairn_phi_incremental assemble \
            --source "$RUNNER_TEMP/cairn-published/hypotheses.json" \
            --prior phi-state/phi/latest.json \
            --work "$RUNNER_TEMP/cairn-phi-work" \
            --output "$RUNNER_TEMP/cairn-phi-result/latest.json" \
            --max-cases 10 --max-age-hours 24
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"cairn-phi-result/latest.json"
          d=json.loads(p.read_text())
          assert d["schema"]=="cairn.phi-sidecar.v1"
          assert d["signed_evidence_modified"] is False
          assert all(r.get("evaluations")==[] for r in d["cases"].values())
          assert all(r.get("analyst_approved") is False for r in d["cases"].values())
          print("Published sidecar summary",json.dumps(d["summary"]))
          PY
      - name: Retain provisional model receipt for forensic audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cairn-phi-postdeploy-${{ github.run_id }}
          path: ${{ runner.temp }}/cairn-phi-result/latest.json
          if-no-files-found: warn
          retention-days: 90
      - name: Commit only model sidecar to isolated results branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phi-state/phi
          python - <<'PY'
          import datetime as dt,json,os
          from pathlib import Path
          new=Path(os.environ["RUNNER_TEMP"])/"cairn-phi-result/latest.json"
          old=Path("phi-state/phi/latest.json")
          if old.exists():
              prior=json.loads(old.read_text())
              curr=json.loads(new.read_text())
              def parse(x):
                  try: return dt.datetime.fromisoformat(x.replace("Z","+00:00"))
                  except (ValueError,AttributeError): return None
              p=parse(prior.get("source_build_generated_at"))
              c=parse(curr.get("source_build_generated_at"))
              if p and c and p>c:
                  Path(os.environ["RUNNER_TEMP"],"cairn-phi-superseded").touch()
                  print("Newer published source already has a result; avoid older overwrite")
          PY
          if [ -f "$RUNNER_TEMP/cairn-phi-superseded" ]; then exit 0; fi
          cp "$RUNNER_TEMP/cairn-phi-result/latest.json" phi-state/phi/latest.json
          git -C phi-state config user.name "github-actions[bot]"
          git -C phi-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C phi-state add phi/latest.json
          if git -C phi-state diff --cached --quiet; then exit 0; fi
          git -C phi-state commit -m "Update provisional CAIRN Phi results from run ${{ github.run_id }}"
          git -C phi-state push origin HEAD:cairn-phi-results
