name: Validate and publish AIBA
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Collect AIBA operational feeds', 'Ingest AIBA analyst OSINT report', 'Collect CAIRN public alternative sensors']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '35 14 * * *'
permissions:
  contents: read
concurrency:
  group: aiba-${{ github.ref }}
  cancel-in-progress: false
jobs:
  swpc-ripe-public-live-probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only NOAA SWPC / RIPE public aggregate probe
        run: |
          python alternative_sensor_pipeline.py --state /tmp/cairn-swpc-ripe --sources swpc,ripe
          python - <<'PY'
          import json
          from pathlib import Path
          for mode in ('swpc','ripe'):
              file=Path('/tmp/cairn-swpc-ripe/health')/(mode+'.json')
              state=json.loads(file.read_text())
              print(mode, 'health:', state['status'],
                    'records:',state['records'],
                    'queried:',state['source_queries_ok'],'/',state['source_queries_attempted'],
                    'errors:',state.get('source_errors',[])[:2])
          PY
  cairn-public-sensor-probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect bounded first-party public source envelopes without publishing
        run: |
          python alternative_sensor_pipeline.py --state /tmp/cairn-public-sensor-probe
      - name: Assert provider-level health receipts and no invented all-clear
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from alternative_sensor_pipeline import MODES,SCHEMA
          path=Path("/tmp/cairn-public-sensor-probe/health")
          for name in MODES:
              d=json.loads((path/(name+".json")).read_text())
              assert d["schema"]==SCHEMA
              assert d["status"] in ("collected","partial","unavailable")
              assert d["operational_warning_approved"] is False
              assert d["source_queries_attempted"]>=1
              if d["status"]=="unavailable":
                  assert d["records"] is None
                  assert d["missingness"]=="not_measured_not_zero"
              print(name, d["status"], "valid records:",
                    d["records"],"queries:",
                    d["source_queries_ok"],"/",d["source_queries_attempted"])
          PY
  topic-quality-audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local analytic dependencies
        run: python -m pip install -r requirements.txt
      - name: Measure dated source-title topic pair error, lexical vs hybrid
        run: python scripts/eval_family_topics.py --out topic-quality-audit.json
      - name: Preserve machine-readable quality audit and error cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cairn-topic-quality-audit
          path: topic-quality-audit.json
          if-no-files-found: ignore
  automatic-topics-real-input:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: aiba-feed-data
          path: ops-state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned local embedding dependencies
        run: python -m pip install -r requirements.txt
      - name: Inspect automatic family assignments from real registry without writing
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          from dashboard.dynamic_bins import build
          from dashboard.automatic_topics import assign, documents
          reg=json.loads(Path('ops-state/observations/latest/behavioral_registry.json').read_text())
          now=dt.datetime.fromisoformat(reg['generated_at'].replace('Z','+00:00'))
          result=build(reg,{'records':[]},now=now+dt.timedelta(minutes=10))
          auto=[x for x in result['families'] if x['kind']=='analytical_topic_family'
               and x.get('activity')=='automatically_discovered_shared_subject']
          print('Automatic topical families found:',len(auto))
          for family in auto[:30]:
              print(family['title'][:100], 'docs:',family['notice_count'],
                    'sources:',family['source_record_count'],
                    'providers:',family['providers'])
              assert family['notice_count']>=2
              assert family['warning_approved'] is False
              assert family['source_independence_established'] is False
              assert family['map_eligible'] is False
              assert family['anomaly_metric'].get('status') in ('not_calibrated','calibrated_metric')
              assert all(n['source_url'].startswith('https://') for n in family['notice_groups'])
          # Repeated template-only travel and FAA feeds must not become
          # independent, unverified bulk topics.
          assert not any(f['source_families']==['protective_notice'] for f in auto)
          # Repeat notices at one documented airspace subject (e.g., Boise)
          # CAN be an analytical topic. Blanket source-wide clustering cannot.
          total_airspace=sum(x.get('source_family')=='airspace_restriction'
                             for x in reg['records'])
          for f in auto:
              if f['source_families']==['airspace_restriction']:
                  assert f['source_record_count'] < max(5,int(total_airspace*0.65)), (
                      'Source template appears to have swallowed a majority of FAA records',
                      f['title'], f['source_record_count'], total_airspace)
          print('Original source documents:',len(documents(reg['records'])))
          PY
  analytical-topic-real-input:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: aiba-feed-data
          path: ops-state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned local embedding dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Denmark official topic grouping on real saved notices
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          from dashboard.dynamic_bins import build
          from dashboard.topic_families import topic_key
          path=Path("ops-state/observations/latest/behavioral_registry.json")
          raw=json.loads(path.read_text())
          when=dt.datetime.fromisoformat(raw["generated_at"].replace("Z","+00:00"))
          # The classifier accepts both "firing exercise" and "firing
          # exercises" as the same source-declared maritime activity.
          # Keep the regression's reference set aligned with the actual
          # source classification, not one literal English inflection.
          observed=[x for x in raw["records"]
              if topic_key(x)==("Denmark","maritime-firing-exercises")]
          result=build(raw,{"records":[]},now=when+dt.timedelta(minutes=10))
          groups=[f for f in result["families"] if
                  f.get("kind")=="analytical_topic_family" and f.get("country")=="Denmark"]
          if len(observed)>=2:
              assert len(groups)==1, (len(observed), len(groups))
              f=groups[0]
              assert f["notice_count"]==len({x["source_url"] for x in observed})
              assert f["source_record_count"]==len(observed)
              assert sum(n["source_record_count"] for n in f["notice_groups"])==len(observed)
              assert f["source_independence_established"] is False
              assert f["warning_approved"] is False
              assert f["anomaly_metric"]["z_score"] is None
              print("Live registry: grouped",len(observed),"fragments into",
                    f["notice_count"],"distinct notices in one Denmark analyst family")
          else:
              print("No eligible current Denmark notices; synthetic tests remain required.")
          PY
  family-archive-real-input:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: aiba-feed-data
          path: ops-state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned local embedding dependencies
        run: python -m pip install -r requirements.txt
      - name: Dry-run archive migration on actual public evidence snapshots
        run: |
          python - <<'PY'
          from pathlib import Path
          from family_archive import update
          snapshot=update(Path("ops-state/observations"),write=False)
          assert snapshot["alerts_promoted"] == 0
          assert snapshot["root_count_total"] >= 0
          print({k:snapshot[k] for k in
              ("root_count_total","record_count_total","new_records_added",
               "historical_relationship_count","public_snapshot_truncated")})
          PY
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python aiba_v5.py --output-dir _site
      - run: python ops_render.py --state /tmp/aiba-missing-feeds --site _site
      - run: python fusion_briefs.py --state /tmp/aiba-missing-feeds
      - run: python decision_render.py --state /tmp/aiba-missing-feeds --site _site
      - run: python scripts/check_dashboard.py _site/index.html
      - run: node --check /tmp/aiba-dashboard.js
      - run: python friction_render.py --state /tmp/aiba-missing-feeds --site _site
      - run: python behavioral_render.py --state /tmp/aiba-missing-feeds --site _site
      - run: python dashboard/build_atlas.py --site _site
      - run: python scripts/check_atlas.py _site
      - run: node --check _site/dashboard/atlas.js
      - run: node --check _site/dashboard/hypotheses.js
      - run: node --check _site/dashboard/layers.js
  collect:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: aiba-feed-data
          path: ops-state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: cache
          key: gdelt-${{ runner.os }}-${{ github.run_id }}
          restore-keys: gdelt-${{ runner.os }}-
      - name: Collect with strict GDELT gate; degrade only on missing archives
        shell: bash
        run: |
          set +e
          python aiba_v5.py --download-days 35 --wiki-days 90 --strict-gdelt --output-dir _site > /tmp/aiba-strict.log 2>&1
          rc=$?
          set -e
          cat /tmp/aiba-strict.log
          if [ "$rc" -ne 0 ]; then
            if ! grep -q 'REFUSING TO PUBLISH: require all 7 recent and 28 baseline valid daily archives' /tmp/aiba-strict.log; then
              echo "::error::Unexpected build failure; do not mask it with a partial publication"
              exit "$rc"
            fi
            echo "::warning::GDELT daily archive window incomplete. Publishing other validated feeds; suppressing GDELT discovery."
            python aiba_v5.py --wiki-days 90 --allow-partial-gdelt --output-dir _site
            python - <<'PY'
          import json
          from pathlib import Path
          status=json.loads(Path("_site/collection_status.json").read_text())
          if status["discovery_status"] != "missing_data":
              raise SystemExit("Degraded build did not report missing GDELT data")
          print("Partial publication: GDELT discovery suppressed; other feeds may continue.")
          PY
          fi
      - run: python ops_render.py --state ops-state/observations --site _site
      - run: python decision_render.py --state ops-state/observations --site _site
      - run: python scripts/check_dashboard.py _site/index.html
      - run: node --check /tmp/aiba-dashboard.js
      - name: Collect optional public map overlays
        run: python dashboard/collect_layers.py --output _site/layers.json
      - run: python friction_render.py --state ops-state/observations --site _site
      - run: python behavioral_render.py --state ops-state/observations --site _site
      - run: python dashboard/build_atlas.py --site _site --state ops-state/observations
        env:
          AIBA_LAYER_FEED_URL: ${{ vars.AIBA_LAYER_FEED_URL || 'layers.json' }}
      - run: python scripts/check_atlas.py _site
      - run: node --check _site/dashboard/atlas.js
      - run: node --check _site/dashboard/hypotheses.js
      - run: node --check _site/dashboard/layers.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: collect
    if: github.ref == 'refs/heads/main' && vars.AIBA_PUBLISH_APPROVED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  operational-smoke:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe public source feeds without writing or publishing
        shell: bash
        run: |
          python ops_pipeline.py --mode markets --state /tmp/aiba-live-probe
          python watchlist_collector.py --state /tmp/aiba-live-probe
          python ops_pipeline.py --mode official --state /tmp/aiba-live-probe
          python ops_pipeline.py --mode commercial --state /tmp/aiba-live-probe
          python scripts/smoke_ops.py /tmp/aiba-live-probe

  atlas-browser:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Build offline Pages preview
        run: |
          python aiba_v5.py --output-dir _site
          python ops_render.py --state /tmp/aiba-globe-no-ops --site _site
          python fusion_briefs.py --state /tmp/aiba-globe-no-ops
          python decision_render.py --state /tmp/aiba-globe-no-ops --site _site
          python friction_render.py --state /tmp/aiba-globe-no-ops --site _site
          python behavioral_render.py --state /tmp/aiba-globe-no-ops --site _site
          python dashboard/build_atlas.py --site _site
      - name: Install local browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
      - name: Serve built page and test actual interactions
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory _site > /tmp/aiba-atlas-server.log 2>&1 &
          sleep 2
          node scripts/test_atlas_browser.js
          node scripts/test_dynamic_bins_browser.js
          node scripts/test_topic_families_browser.js
          node scripts/test_automatic_topics_browser.js
          node scripts/test_source_status_browser.js
          node scripts/test_cairn_priority_browser.js
          node scripts/test_atlas_behavior_browser.js
          node scripts/test_atlas_evaluation_browser.js
          node scripts/test_aircraft_browser.js
      - name: Attach dashboard browser preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-preview
          path: atlas-preview.jpg
          if-no-files-found: ignore

  friction-live-probe:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # API accessibility is external and not needed for offline correctness.
    # The live status MUST still be reviewed manually before enabling alerts.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect IODA envelope structure (keys only; no raw event logging)
        continue-on-error: true
        run: |
          python - <<'PY'
          import datetime as dt
          from urllib.parse import urlencode
          from friction_pipeline import IODA, fetch
          now=int(dt.datetime.now(dt.timezone.utc).timestamp())
          data=fetch(IODA+"?"+urlencode({
              "from":now-14400,"until":now,"entityType":"country",
              "limit":10,"page":0,"extendWindowSeconds":0}))
          nested=data.get("data") if isinstance(data,dict) else None
          print("IODA envelope:",{
              "kind":type(data).__name__,
              "keys": sorted(data.keys())[:16] if isinstance(data,dict) else [],
              "type":str(data.get("type"))[:80] if isinstance(data,dict) else "",
              "error":str(data.get("error"))[:250] if isinstance(data,dict) else "",
              "data_kind":type(nested).__name__,
              "data_keys":sorted(nested.keys())[:16] if isinstance(nested,dict) else [],
              "data_items":len(nested) if isinstance(nested,list) else None,
              "first_item_keys":sorted(nested[0].keys())[:15] if isinstance(nested,list) and nested and isinstance(nested[0],dict) else [],
          })
          PY
      - name: Probe bounded NGA and IODA endpoints without publishing
        shell: bash
        run: |
          set +e
          python friction_pipeline.py --state /tmp/aiba-friction-pr
          status=$?
          set -e
          python friction_synthesis.py --state /tmp/aiba-friction-pr
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("/tmp/aiba-friction-pr/health")
          lines=["## AIBA friction source probe (NO production ingestion)","","| Feed | Status | Records | Error |","|---|---|---:|---|"]
          for name in ("ioda","nga","amsa"):
              health=json.loads((root/f"friction_{name}.json").read_text())
              lines.append(f"| {name} | {health['status']} | {health['records']} | {str(health.get('error') or '')[:100]} |")
          summary="\n".join(lines)+"\n"
          print(summary)
          import os
          if os.getenv("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f: f.write(summary)
          PY
          if [ "$status" -ne 0 ]; then
            echo "::warning::No friction feeds responded with valid usable JSON in PR probe"
          fi

  live-restrictions-probe:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check official geometry feed compatibility without production writes
        shell: bash
        run: |
          set +e
          python dashboard/live_layer_snapshots.py --state /tmp/aiba-live-restrictions-pr
          rc=$?
          set -e
          python - <<'PY'
          import json,os
          from pathlib import Path
          health=Path("/tmp/aiba-live-restrictions-pr/health/live_layers.json")
          if not health.exists():
              raise SystemExit("No live source health generated")
          rows=json.loads(health.read_text())
          lines=["## Official near-live restriction probe (PR only)","",
                 "| Source | Status | Valid notices | Shapes | Points | Skipped |",
                 "|---|---|---:|---:|---:|---:|"]
          for key in ("airspace","maritime"):
              r=rows[key]
              lines.append(f"| {key} | {r['status']} | {r['record_count']} | {r.get('shape_records')} | {r.get('point_records')} | {r['skipped']} |")
          summary="\n".join(lines)+"\n"
          print(summary)
          if os.getenv("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:f.write(summary)
          PY
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Neither official restriction source could be parsed; do not claim near-live coverage."
          fi
