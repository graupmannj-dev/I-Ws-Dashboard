name: Ingest AIBA analyst OSINT report
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      report_json:
        description: "Validated OSINT report JSON (public repo; no secrets or sensitive data)"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: aiba-operational-snapshots
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # The *only* accepted comment source is the project owner's account, on
    # the dedicated public intake issue. Pull-request comments are excluded.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 9 &&
       !github.event.issue.pull_request &&
       github.event.comment.user.id == 320673296 &&
       startsWith(github.event.comment.body, 'AIBA-OSINT-V1'))
    steps:
      - name: Checkout application validation code
        uses: actions/checkout@v4
        with:
          path: src
          persist-credentials: false
      - name: Checkout durable observation branch
        uses: actions/checkout@v4
        with:
          ref: aiba-feed-data
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate manually dispatched report
        if: github.event_name == 'workflow_dispatch'
        env:
          AIBA_REPORT_JSON: ${{ inputs.report_json }}
        run: python src/scripts/import_analyst_report.py --state state/observations --from-env
      - name: Validate authenticated owner comment
        if: github.event_name == 'issue_comment'
        env:
          # Never interpolate untrusted issue-comment text inside a shell command.
          AIBA_REPORT_JSON: ${{ github.event.comment.body }}
        run: python src/scripts/import_analyst_report.py --state state/observations --from-env --comment-envelope
      - name: Commit report to evidence branch only
        shell: bash
        run: |
          set -euo pipefail
          cd state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add observations/analyst/history
          if git diff --cached --quiet; then
            echo "No new report"
          else
            git commit -m "AIBA analyst OSINT intake $GITHUB_RUN_ID [skip ci]"
            git push origin HEAD:refs/heads/aiba-feed-data
          fi
