name: AIBA private tipper head anchor contract tests (PR only)
on:
  pull_request:
    paths:
      - 'scripts/aiba_tipper_anchor.py'
      - 'tests/test_aiba_tipper_anchor.py'
      - 'docs/AIBA_SIGNED_TIPPER_LEDGER_ANCHORS.md'
      - '.github/workflows/aiba-tip-anchor-tests.yml'
permissions:
  contents: read
jobs:
  offline-hash-anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and validate private-ledger hash-only exports
        run: |
          python -m compileall -q scripts/aiba_tipper_anchor.py
          python -m unittest tests.test_aiba_tipper_anchor tests.test_aiba_tipper_ledger -v
