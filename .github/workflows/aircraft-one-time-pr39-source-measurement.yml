name: ONE TIME PR39 full-day aircraft archive feasibility (no publishing)

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read

jobs:
  one-off-measurement:
    if: github.event.pull_request.number == 39 && github.event.pull_request.head.repo.full_name == 'graupmannj-dev/I-Ws-Dashboard' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout PR without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: One controlled archive download and full TAR scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aiba-one-day-report"
          python scripts/aircraft_one_day_benchmark.py \
            --pin data/validation/aircraft_one_day_source_pin.json \
            --cohort data/validation/aircraft_one_day_benchmark_control.json \
            --execute --acknowledge YES_ONE_DAY_3_69_GB \
            --work-dir "$RUNNER_TEMP" \
            --output "$RUNNER_TEMP/aiba-one-day-report/receipt.json"
      - name: Retain only aggregate source measurement; no flight geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-off-full-day-source-metrics-${{ github.run_id }}
          path: ${{ runner.temp }}/aiba-one-day-report/receipt.json
          if-no-files-found: warn
          retention-days: 7
