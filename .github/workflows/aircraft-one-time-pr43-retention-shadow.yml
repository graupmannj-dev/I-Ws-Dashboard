name: ONE-TIME PR43 held-out aircraft retention loss experiment

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read

jobs:
  one-off-heldout-retention:
    if: github.event.pull_request.number == 43 && github.event.pull_request.head.repo.full_name == 'graupmannj-dev/I-Ws-Dashboard' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: One pinned held-out source acquisition and in-memory loss audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aiba-retention-shadow"
          python scripts/aircraft_retention_shadow_run.py \
            --pin data/validation/aircraft_one_day_source_pin.json \
            --execute --acknowledge YES_ONE_HELDOUT_3_69_GB \
            --work-dir "$RUNNER_TEMP" \
            --output "$RUNNER_TEMP/aiba-retention-shadow/receipt.json"
      - name: Retain aggregate audit only; never publish selected tracks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-off-aircraft-retention-shadow-${{ github.run_id }}
          path: ${{ runner.temp }}/aiba-retention-shadow/receipt.json
          if-no-files-found: warn
          retention-days: 7
