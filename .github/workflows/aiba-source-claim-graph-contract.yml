name: AIBA source body and claim graph contract
on:
  pull_request:
    paths:
      - 'scripts/aiba_source_text_intake.py'
      - 'scripts/aiba_claim_lab.py'
      - 'tests/test_aiba_claim_lab.py'
      - 'scripts/aiba_claim_graph_eval.py'
      - 'tests/test_aiba_claim_graph_eval.py'
      - 'scripts/aiba_dvids_asset_adapter.py'
      - 'scripts/aiba_dvids_fetch.py'
      - 'scripts/aiba_extracted_claim_graph.py'
      - 'tests/test_aiba_source_text_graph.py'
      - '.github/workflows/aiba-source-claim-graph-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rights, provenance and candidate graph tests
        run: PYTHONPATH=. python -m unittest tests.test_aiba_source_text_graph tests.test_aiba_claim_lab tests.test_aiba_claim_graph_eval
      - name: Offline ingestion/graph CLI sanity
        run: |
          python -m compileall -q scripts/aiba_source_text_intake.py scripts/aiba_dvids_asset_adapter.py scripts/aiba_dvids_fetch.py scripts/aiba_extracted_claim_graph.py scripts/aiba_claim_lab.py scripts/aiba_claim_graph_eval.py
          test -z "$(git status --porcelain)"
