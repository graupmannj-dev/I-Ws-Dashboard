name: ONE-TIME PR51 real prospective readiness and evidence funnel check
on:
  pull_request:
    types: [ready_for_review]
permissions:
  contents: read
jobs:
  prospective-readiness:
    if: github.event.pull_request.number == 51 && github.event.pull_request.head.repo.full_name == 'graupmannj-dev/I-Ws-Dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout code read-only
        uses: actions/checkout@v4
        with:
          path: src
          persist-credentials: false
      - name: Checkout actual AIBA observations read-only
        uses: actions/checkout@v4
        with:
          path: state
          ref: aiba-feed-data
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check genuinely prospective source snapshots without creating a private ledger
        env:
          RUN_ROOT: ${{ runner.temp }}/aiba-real-pilot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUN_ROOT"
          python src/scripts/aiba_private_pilot_capture.py \
            --registry state/observations/latest/behavioral_registry.json \
            --fusion state/observations/latest/behavioral_fusion.json \
            > "$RUN_ROOT/preflight.json" || true
          python - <<'PY'
          import datetime,json,os,pathlib
          root=pathlib.Path(os.environ["RUN_ROOT"])
          record=json.loads((root/"preflight.json").read_text())
          print("RUN_UTC",datetime.datetime.now(datetime.timezone.utc).isoformat())
          print("SHADOW_PREFLIGHT_STATUS",record.get("status"))
          print("FAIL_CLOSED_REASON",record.get("reason") or "none")
          print("ACTUAL_FRAME_FROZEN",False)
          print("ANALYST_FORECAST_ISSUED",False)
          if record.get("status") not in ("preflight_only_not_frozen","unavailable"):
              raise SystemExit("Unrecognized preflight state")
          PY
      - name: Always retain aggregate gate result; never source or ledger files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-off-pr51-real-prospective-source-gate-${{ github.run_id }}
          path: ${{ runner.temp }}/aiba-real-pilot/preflight.json
          retention-days: 7
          if-no-files-found: warn
